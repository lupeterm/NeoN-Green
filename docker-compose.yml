# Map + live bike data.
#   cp .env.example .env && docker compose up -d
#   map  -> http://localhost:8080      api -> http://localhost:8000      tiles -> http://localhost:3000
#
# The ingestor stack (postgis, app, scheduler, martin) comes unchanged from the
# submodule ingestor/ (reedu-reengineering-education/atrai-bikes-ingestor).
include:
  - path: ingestor/docker-compose.yml
    env_file: .env

services:
  web:
    image: nginx:1.27-alpine
    container_name: neon_green_web
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - .:/usr/share/nginx/html:ro
    restart: unless-stopped

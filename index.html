<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>NeoN-Green – Was wäre, wenn?</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@turf/turf@7.1.0/turf.min.js"></script>
  <script src="https://unpkg.com/suncalc@1.9.0/suncalc.js"></script>
  <script src="model.js"></script>
  <style>
    :root { --bg: #ffffffee; --fg: #1d2329; --muted: #5f6b76; --line: #d8dee4; --accent: #2f9e44; --cool: #1c7ed6; }
    html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); }
    #map { position: absolute; inset: 0; }
    .card { position: absolute; z-index: 2; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
            box-shadow: 0 2px 12px #0002; padding: 12px 14px; width: 280px; max-width: calc(100vw - 52px); box-sizing: border-box; }
    #panel { top: 10px; left: 10px; }
    #scenario { top: 10px; right: 52px; }
    h1, h2 { font-size: 15px; margin: 0 0 8px; }
    label { display: block; margin: 8px 0 2px; font-weight: 600; font-size: 12px; color: var(--muted); }
    label span { float: right; font-weight: 400; color: var(--fg); }
    select, input[type=date] { width: 100%; box-sizing: border-box; font: inherit; padding: 3px 4px; }
    input[type=range] { width: 100%; margin: 2px 0; accent-color: var(--accent); }
    .muted { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
    .err { color: #c92a2a; }
    #ramp { height: 10px; border-radius: 3px; margin-top: 10px; }
    .ticks { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
    header { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
    #close { border: 0; background: none; font-size: 20px; line-height: 1; cursor: pointer; color: var(--muted); padding: 0; }
    dl { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; margin: 12px 0 0; padding-top: 10px; border-top: 1px solid var(--line); }
    dt { color: var(--muted); } dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
    dd.big { font-size: 18px; font-weight: 700; color: var(--cool); }
    @media (max-width: 640px) { #scenario { top: auto; bottom: 30px; right: 10px; left: 10px; width: auto; max-width: none; } }
  </style>
</head>
<body>
  <div id="map"></div>

  <aside id="panel" class="card">
    <h1>Was wäre, wenn …?</h1>
    <label>Daten</label>
    <select id="overlay"></select>
    <p id="status" class="muted"></p>
    <label>Datum</label>
    <input type="date" id="date">
    <label>Uhrzeit <span id="timeLabel"></span></label>
    <input type="range" id="time" min="300" max="1320" step="10" value="900">
    <p id="sun" class="muted"></p>
    <div id="ramp"></div>
    <div class="ticks"><span id="dmin"></span><span id="unit"></span><span id="dmax"></span></div>
    <p class="muted">Hineinzoomen und auf eine Straße klicken, um Bäume zu pflanzen.</p>
  </aside>

  <aside id="scenario" class="card" hidden>
    <header><h2 id="street"></h2><button id="close" title="Szenario entfernen">×</button></header>
    <label>Abschnitt von <span id="secLabel"></span></label>
    <input type="range" id="secStart" min="0" max="100" value="0">
    <label>bis</label>
    <input type="range" id="secEnd" min="0" max="100" value="100">
    <label>Bäume <span id="treeLabel"></span></label>
    <input type="range" id="trees" min="0" max="40" value="8">
    <label>Baumgröße</label>
    <select id="preset"></select>
    <dl id="result"></dl>
    <p class="muted">Vereinfachtes Lehrmodell: Kronenschatten nach Sonnenstand plus Verdunstungskühlung.
      Werte in <code>config/model.json</code>.</p>
  </aside>

  <script src="app.js"></script>
</body>
</html>

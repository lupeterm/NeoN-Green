<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>NeoN-Green – What if?</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@turf/turf@7.1.0/turf.min.js"></script>
  <script src="https://unpkg.com/suncalc@1.9.0/suncalc.js"></script>
  <script src="model.js"></script>
  <style>
    :root { --bg: #ffffffee; --fg: #1d2329; --muted: #5f6b76; --line: #d8dee4; --accent: #2f9e44; --cool: #1c7ed6;
            --field: #ffffff; --hover: #f1f3f5; --err: #c92a2a; color-scheme: light; }
    :root[data-theme="dark"] { --bg: #1d2127ee; --fg: #e9ecef; --muted: #a0aab4; --line: #3a414b; --accent: #37b24d; --cool: #4dabf7;
            --field: #262b32; --hover: #2c323a; --err: #ff6b6b; color-scheme: dark; }
    body { background: var(--field); }
    select, input[type=date], button { background: var(--field); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; }
    .maplibregl-popup-content { background: var(--bg); color: var(--fg); }
    .maplibregl-popup-anchor-top .maplibregl-popup-tip { border-bottom-color: var(--bg); }
    .maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: var(--bg); }
    .maplibregl-popup-anchor-left .maplibregl-popup-tip { border-right-color: var(--bg); }
    .maplibregl-popup-anchor-right .maplibregl-popup-tip { border-left-color: var(--bg); }
    .theme-toggle { display: flex !important; align-items: center; justify-content: center; color: #333; }
    .season-switch button { font-size: 16px; line-height: 29px; opacity: 0.55; filter: grayscale(0.6); }
    .season-switch button:hover { opacity: 0.9; filter: none; }
    .season-switch button.active { opacity: 1; filter: none; background: #e9f7ec; box-shadow: inset 3px 0 0 var(--accent); }
    :root[data-theme="dark"] .season-switch button.active { background: #24392b; }
    :root[data-theme="dark"] .maplibregl-ctrl-group { background: #262b32; }
    :root[data-theme="dark"] .maplibregl-ctrl-group button + button { border-top-color: #3a414b; }
    :root[data-theme="dark"] .maplibregl-ctrl-group button .maplibregl-ctrl-icon { filter: invert(1); }
    :root[data-theme="dark"] .theme-toggle { color: #ffd43b; }
    :root[data-theme="dark"] .maplibregl-ctrl-attrib, :root[data-theme="dark"] .maplibregl-ctrl-scale { background: #1d2127cc; color: #c1c8cf; border-color: #a0aab4; }
    :root[data-theme="dark"] .maplibregl-ctrl-attrib a { color: #c1c8cf; }
    html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); }
    #map { position: absolute; inset: 0; }
    .card { position: absolute; z-index: 2; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
            box-shadow: 0 2px 12px #0002; padding: 12px 14px; width: 280px; max-width: calc(100vw - 52px); box-sizing: border-box;
            max-height: calc(100vh - 40px); overflow-y: auto; }
    #panel { top: 10px; left: 10px; }
    #scenario { top: 10px; right: 52px; }
    h1, h2 { font-size: 15px; margin: 0 0 8px; }
    label { display: block; margin: 8px 0 2px; font-weight: 600; font-size: 12px; color: var(--muted); }
    label span { float: right; font-weight: 400; color: var(--fg); }
    select, input[type=date] { width: 100%; box-sizing: border-box; font: inherit; padding: 3px 4px; }
    input[type=range] { width: 100%; margin: 2px 0; accent-color: var(--accent); }
    .muted { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
    .err { color: var(--err); }
    #ramp, .ramp { height: 10px; border-radius: 3px; margin-top: 10px; }
    .ramp { margin-top: 6px; height: 8px; }
    button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--field); color: var(--fg); border-radius: 6px; padding: 5px 10px; }
    button.primary { width: 100%; margin-top: 10px; background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button.primary.active { background: var(--field); color: var(--accent); }
    label.check { display: flex; gap: 6px; align-items: center; font-weight: 400; color: var(--fg); font-size: 13px; }
    .seg { display: flex; margin-top: 10px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
    .seg label { flex: 1; margin: 0; text-align: center; padding: 5px 0; cursor: pointer; color: var(--fg); font-weight: 400; font-size: 13px; }
    .seg input { display: none; }
    .seg label:has(input:checked) { background: var(--accent); color: #fff; font-weight: 600; }
    #layers { margin-top: 4px; border-top: 1px solid var(--line); }
    .table-wrap { overflow-x: auto; margin-top: 4px; }
    .data-table { border-collapse: collapse; font-size: 11px; width: 100%; font-variant-numeric: tabular-nums; }
    .data-table th, .data-table td { padding: 2px 4px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .data-table th:first-child, .data-table td:first-child { text-align: left; white-space: normal; }
    .data-table th { color: var(--muted); font-weight: 600; }
    .maplibregl-popup-content dl { margin: 6px 0 0; padding: 0; border: 0; font-size: 12px; }
    #hint { color: var(--err); min-height: 0; }
    .sources { margin-top: 8px; font-size: 12px; }
    .sources summary { cursor: pointer; color: var(--cool); font-weight: 600; }
    .sources h3 { font-size: 12px; margin: 8px 0 2px; }
    .sources p { margin: 2px 0; color: var(--muted); }
    .sources ol { margin: 2px 0 0; padding-left: 18px; }
    .sources a { color: var(--cool); }
    .ticks { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
    header { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
    #close { border: 0; background: none; font-size: 20px; line-height: 1; cursor: pointer; color: var(--muted); padding: 0; }
    dl { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; margin: 12px 0 0; padding-top: 10px; border-top: 1px solid var(--line); }
    dt { color: var(--muted); } dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
    dd.big { font-size: 18px; font-weight: 700; color: var(--cool); }
    #hotspots { margin: 2px 0 0; padding: 0; list-style: none; }
    #hotspots button { all: unset; box-sizing: border-box; display: flex; justify-content: space-between; gap: 8px;
                       width: 100%; padding: 3px 4px; border-radius: 4px; cursor: pointer; }
    #hotspots button:hover, #hotspots button:focus-visible { background: var(--hover); }
    #hotspots b { color: var(--err); font-variant-numeric: tabular-nums; white-space: nowrap; }
    @media (max-width: 640px) { #scenario { top: auto; bottom: 30px; right: 10px; left: 10px; width: auto; max-width: none; } }
  </style>
</head>
<body>
  <div id="map"></div>

  <aside id="panel" class="card">
    <h1>What if …?</h1>
    <label>Data</label>
    <select id="overlay"></select>
    <p id="status" class="muted"></p>
    <label>Date</label>
    <input type="date" id="date">
    <label>Time of day <span id="timeLabel"></span></label>
    <input type="range" id="time" min="300" max="1320" step="10" value="900">
    <p id="sun" class="muted"></p>
    <div id="ramp"></div>
    <div class="ticks"><span id="dmin"></span><span id="unit"></span><span id="dmax"></span></div>
    <div id="hotspotBox" hidden>
      <label>Heat hotspots <span>bike rides</span></label>
      <ol id="hotspots"></ol>
      <p id="hotspotNote" class="muted"></p>
    </div>
    <button id="drawBtn" class="primary">Draw a section</button>
    <p class="muted">Draw around part of a street, or click a street to select all of it.</p>
    <div id="layers"></div>
  </aside>

  <aside id="scenario" class="card" hidden>
    <header><h2 id="street"></h2><button id="close" title="Remove scenario">×</button></header>
    <p id="secLabel" class="muted"></p>
    <button id="view3d" class="primary">3D street view</button>
    <div class="seg">
      <label><input type="radio" name="mode" value="even" checked>evenly spaced</label>
      <label><input type="radio" name="mode" value="manual">by hand</label>
    </div>
    <div id="evenCtl">
      <label>Trees <span id="treeLabel"></span></label>
      <input type="range" id="trees" min="0" max="40" value="8">
    </div>
    <div id="manualCtl" hidden>
      <p class="muted">Click the map to plant a tree, click a new tree to remove it.</p>
      <label><span id="manualCount" style="float:none"></span></label>
      <button id="clearTrees">Remove all</button>
    </div>
    <label>Tree size</label>
    <select id="preset"></select>
    <p id="hint" class="muted"></p>
    <dl id="result"></dl>
    <p class="muted">Simplified teaching model: crown shadows from the sun position plus evaporative cooling.
      Parameters in <code>config/model.json</code>.</p>
    <details id="sources" class="sources">
      <summary>Model sources</summary>
      <div id="sourceList"></div>
    </details>
  </aside>

  <script src="app.js"></script>
</body>
</html>
